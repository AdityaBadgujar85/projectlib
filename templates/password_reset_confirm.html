<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    {% load static %}
    <link rel="stylesheet" href={%static 'css/password_reset_confirm.css' %}>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
           <a href="/"><img src={%static 'img/Borcelle.png'%} alt=""></a>
        </div>
        <div class="link">
            <a href="/">Home</a>
            <a href="">About</a>
            <a href="/Login/">Login</a>
            <a href="/Register/">Signup</a>
        </div>
    </nav>
    <div class="card">
        <h1>Set a New Password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Set Password</button>
        </form>
</div>

                    <stop offset="0%" stop-color="#000046" />
                    <stop offset="100%" stop-color="#1CB5E0" />

            </defs>
            
            <!-- Custom Shape with Gradient Fill -->
