<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Set New Password | LearnVishwa</title>

    {% load static %}

    <link
      rel="shortcut icon"
      href="{% static 'img/favicon.png' %}"
      type="image/x-icon"
    />

    <link
      rel="stylesheet"
      href="{% static 'css/password_reset_confirm.css' %}"
    />
  </head>

  <body>
    {% include "Navbar.html" %}

    <main class="page">
      <div class="card">
        <h1>Set a New Password</h1>

        <p>
          Create a strong password for your LearnVishwa account. Your password
          should be unique and easy for you to remember.
        </p>

        <form method="post">
          {% csrf_token %} {{ form.as_p }}

          <button type="submit">Set Password</button>
        </form>
      </div>
    </main>
  </body>
</html>
