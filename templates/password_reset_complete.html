<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Your LearnVishwa password has been reset successfully."
    />

    <title>Password Reset Complete | LearnVishwa</title>

    {% load static %}

    <link
      rel="shortcut icon"
      href="{% static 'img/favicon.png' %}"
      type="image/x-icon"
    />

    <link
      rel="stylesheet"
      href="{% static 'css/password_reset_complete.css' %}"
    />
  </head>

  <body>
    {% include "Navbar.html" %}

    <main class="page">
      <section class="card">
        <div class="successIcon">✓</div>

        <h1>Password Reset Complete</h1>

        <p>
          Your password has been successfully reset. You can now sign in using
          your new password.
        </p>

        <a href="{% url 'Login' %}" class="loginBtn"> Go to Login </a>
      </section>
    </main>
  </body>
</html>
