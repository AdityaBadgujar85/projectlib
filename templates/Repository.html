                <script>
                    function clearAllFilters() {
                        // Clear URL parameters
                        history.replaceState(null, '', window.location.pathname);
                
                        // Uncheck all checkboxes
                        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                        checkboxes.forEach(checkbox => checkbox.checked = false);
                
                        // Reset visibility of all filters
                        const filterIds = ['branchFilter', 'yearFilter', 'domainFilter'];
                        filterIds.forEach(filterId => {
                            const filterSection = document.getElementById(filterId);
                            filterSection.style.display = 'none'; // Collapse all filters
                            const header = filterSection.previousElementSibling;
                            header.classList.remove('expanded');
                            localStorage.setItem(filterId, 'closed');
                        });
                
                        // Optionally submit the form to refresh the page
                        document.getElementById('filterForm').submit();
                    }
                </script>
                <div class="filterbutton" style="text-align: center; margin-top: 20px;">
                    <button type="button" onclick="clearAllFilters()">Clear All Filters</button>
                </div>
            </form>
           
            
            <script>
                // Toggle visibility of filter sections
                function toggleFilter(header, filterId) {
                    const filterSection = document.getElementById(filterId);
                    const arrow = header.querySelector('.arrow');
            
                    if (filterSection.style.display === 'block') {
                        filterSection.style.display = 'none';
                        header.classList.remove('expanded');
                        localStorage.setItem(filterId, 'closed'); // Store state
                    } else {
                        filterSection.style.display = 'block';
                        header.classList.add('expanded');
                        localStorage.setItem(filterId, 'open'); // Store state
                    }
                }
            
                // Update URL query parameters based on checkbox changes
                function updateURL(checkbox) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const name = checkbox.name;
                    const value = checkbox.value;
            
                    if (checkbox.checked) {
                        // Add the parameter to the query
                        urlParams.append(name, value);
                    } else {
                        // Remove the parameter from the query
                        const allValues = urlParams.getAll(name).filter(v => v !== value);
                        urlParams.delete(name);
                        allValues.forEach(v => urlParams.append (name, v));
                    }
            
                    // Update the browser URL without reloading the page
                    history.replaceState(null, '', `?${urlParams.toString()}`);
            
                    // Automatically submit the form to trigger the action
                    document.getElementById('filterForm').submit();
                }
            
                // Initialize checkboxes and filter states based on URL parameters and localStorage
                function initializeFilters() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            
                    checkboxes.forEach(checkbox => {
                        const name = checkbox.name;
                        const value = checkbox.value;
            
                        if (urlParams.getAll(name).includes(value)) {
                            checkbox.checked = true;
                        } else {
                            checkbox.checked = false;
                        }
                    });
            
                    // Set the visibility of filter sections based on localStorage
                    const filterIds = ['branchFilter', 'yearFilter', 'domainFilter'];
                    filterIds.forEach(filterId => {
                        const filterSection = document.getElementById(filterId);
                        const state = localStorage.getItem(filterId);
                        if (state === 'open') {
                            filterSection.style.display = 'block';
                            const header = filterSection.previousElementSibling;
                            header.classList.add('expanded');
                        } else {
                            filterSection.style.display = 'none';
                        }
                    });
                }
            
                // Call the initialize function on page load
                window.onload = initializeFilters;
            </script>
