<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Project Repository | LearnVishwa</title>

    {% load static %}

    <link
      rel="shortcut icon"
      href="{% static 'img/favicon.png' %}"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="{% static 'css/Repository.css' %}" />

    <link
      rel="stylesheet"

  <body>
    {% include "Navbar.html" %}

    <!-- ======================================
                Repository
======================================= -->

    <section class="repositoryContainer">
      <!-- Search -->

      <form method="GET" class="searchForm">
        <div class="searchBox">
          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            type="text"
            name="search"
            placeholder="Search projects..."
            value="{{ request.GET.search }}"
          />

          <button type="submit">Search</button>
        </div>
      </form>

      <!-- Filters -->

      <div class="filterHeader">
        <button
          type="button"
          class="filterButton"
          onclick="toggleFilter(this, 'branchFilter')"
        >
          <i class="fa-solid fa-building-columns"></i>

          Branch

          <i class="fa-solid fa-chevron-down arrow"></i>
        </button>

        <button
          type="button"
          class="filterButton"
          onclick="toggleFilter(this, 'yearFilter')"
        >
          <i class="fa-solid fa-calendar-days"></i>

          Year

          <i class="fa-solid fa-chevron-down arrow"></i>
        </button>

        <button
          type="button"
          class="filterButton"
          onclick="toggleFilter(this, 'domainFilter')"
        >
          <i class="fa-solid fa-layer-group"></i>

          Domain

          <i class="fa-solid fa-chevron-down arrow"></i>
        </button>

        <button type="button" class="clearFilter" onclick="clearAllFilters()">
          <i class="fa-solid fa-rotate-left"></i>

          Clear
        </button>
      </div>

      <!-- =====================================
                PROJECTS
    ====================================== -->

      <div class="projectGrid">
        {% for p in student_list %}

        <div class="projectCard">
          <a href="{% url 'Video' p.id %}" class="thumbnail">
            {% if p.thumbnail %}

            <img src="{{ p.thumbnail.url }}" alt="{{ p.title }}" />

            {% else %}

            <img src="{% static 'img/Borcelle.png' %}" alt="Thumbnail" />

            {% endif %}
          </a>

          <div class="projectInfo">
            <span class="projectDomain"> {{ p.domain }} </span>

            <h3>{{ p.title }}</h3>

            <p class="studentName">
              <i class="fa-solid fa-user"></i>

              {{ p.name }}
            </p>

            <a href="{% url 'Video' p.id %}" class="viewProject">
              View Project

              <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        </div>

        {% empty %}

        <div class="emptyState">
          <i class="fa-solid fa-folder-open"></i>

          <h2>No Projects Found</h2>

          <p>No projects match the selected filters.</p>
        </div>

        {% endfor %}
      </div>
    </section>
    <script>
      function clearAllFilters() {
        history.replaceState(null, "", window.location.pathname);

        document.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.checked = false;
        });

        const searchInput = document.querySelector('input[name="search"]');

        if (searchInput) {
          searchInput.value = "";
        }

        ["branchFilter", "yearFilter", "domainFilter"].forEach((id) => {
          const filter = document.getElementById(id);

          if (filter) {
            filter.style.display = "none";
          }

          localStorage.setItem(id, "closed");
        });

        document.getElementById("filterForm").submit();
      }

      function toggleFilter(button, id) {
        const filter = document.getElementById(id);

        if (filter.style.display === "block") {
          filter.style.display = "none";

          localStorage.setItem(id, "closed");
        } else {
          document.querySelectorAll(".filterContent").forEach((item) => {
            item.style.display = "none";
          });

          filter.style.display = "block";

          localStorage.setItem(id, "open");
        }
      }

      function updateURL(checkbox) {
        const params = new URLSearchParams(window.location.search);

        const name = checkbox.name;

        const value = checkbox.value;

        if (checkbox.checked) {
          params.append(name, value);
        } else {
          const values = params.getAll(name).filter((v) => v !== value);

          params.delete(name);

          values.forEach((v) => params.append(name, v));
        }

        const searchInput = document.querySelector('input[name="search"]');

        if (searchInput && searchInput.value.trim() !== "") {
          params.set("search", searchInput.value);
        }

        history.replaceState(null, "", "?" + params.toString());

        document.getElementById("filterForm").submit();
      }

      function initializeFilters() {
        const params = new URLSearchParams(window.location.search);

        document
          .querySelectorAll('input[type="checkbox"]')
          .forEach((checkbox) => {
            if (params.getAll(checkbox.name).includes(checkbox.value)) {
              checkbox.checked = true;
            }
          });

        ["branchFilter", "yearFilter", "domainFilter"].forEach((id) => {
          const state = localStorage.getItem(id);

          if (state === "open") {
            const filter = document.getElementById(id);

            if (filter) {
              filter.style.display = "block";
            }
          }
        });
      }

      window.onload = initializeFilters;
    </script>
  </body>
</html>
