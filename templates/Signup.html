<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href={%static 'css/signup.css'%}>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
           <a href="/"><img src={%static 'img/Borcelle.png'%} alt=""></a>
        </div>
        <div class="link">
            <a href="/">Home</a>
            <a href="/About/">About</a>
            <a href="/Login/">Login</a>
            <a href="/Register/">Signup</a>
        </div>
    </nav>
    <div class="container">
<div class="imgg">
<img src={%static 'img/Untitled design.png'%} alt="">
</div>
<div class="form1">

    <form method="post">
      {% csrf_token %}
        <label for="Username">Username:</label><br>
        <input type="text" placeholder="Username" name="name" required><br>
        <label for="email">Email:</label><br>
        <input type="email" placeholder="Email Address" name="email" required><br>
        <label for="password1">Password:</label><br>
        <input type="password" placeholder="Password" name="password1" required><br>
        <label for="password2">Confirm Password:</label><br>
        <input type="password" placeholder="Confirm Password" name="password2" required><br>
        {% if messages %}
      <ul>
        {% for message in messages %}
          {{ message }}
        {% endfor %}
      </ul>
    {% endif %}
        <div class="links">
        <a href="">Already Have Account?</a>
        </div>
        <button>Login</button>
    </form>

</div>
    </div>
    <div class="custom-shape-divider-bottom-1736520294">

        </svg>
    </div>
</body>
</html>
